name: M15 Signal Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Signal-Check ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Duplikat-Schutz-Datei zurückspeichern
        run: |
          if [ -n "$(git status --porcelain last_signal.json)" ]; then
            git config user.name "m15-signal-bot"
            git config user.email "actions@github.com"
            git add last_signal.json
            git commit -m "Update last_signal.json [skip ci]"
            git push
          fi
