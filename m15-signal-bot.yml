name: Trading Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten über den "Run workflow"-Button

permissions:
  contents: write   # nötig, damit last_signal.json zurück ins Repo committet werden darf

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Signal-Check ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_once.py

      - name: Zustandsdateien zurückspeichern
        run: |
          if [ -n "$(git status --porcelain last_signal.json open_trades.json trade_history.json)" ]; then
            git config user.name "m15-signal-bot"
            git config user.email "actions@github.com"
            git add last_signal.json open_trades.json trade_history.json
            git commit -m "Update state files [skip ci]"
            git push
          fi
